name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run test
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - run: supabase start
      - name: Export local Supabase connection details
        run: supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"
      - run: npm run test:integration
        env:
          INTEGRATION_SUPABASE_URL: ${{ env.API_URL }}
          INTEGRATION_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          INTEGRATION_SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
      - name: Write Cloudflare local dev secrets
        run: |
          echo "SUPABASE_URL=$API_URL" >> .dev.vars
          echo "SUPABASE_KEY=$ANON_KEY" >> .dev.vars
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_SUPABASE_URL: ${{ env.API_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
      - name: Stop local Supabase
        if: always()
        run: supabase stop
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - run: supabase link --project-ref $SUPABASE_PROJECT_ID
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: rmzfmyplwoqtxgdlioaq
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
